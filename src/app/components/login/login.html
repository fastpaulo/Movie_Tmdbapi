<div class="min-h-screen bg-slate-950 flex items-center justify-center p-4 relative overflow-hidden">
  <!-- Efeitos de luz no fundo -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Card de Login -->
  <div class="w-full max-w-md bg-slate-900/60 backdrop-blur-xl border border-slate-800 p-8 rounded-2xl shadow-2xl relative z-10">
    
    <!-- Cabeçalho -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600/20 text-indigo-400 mb-4 border border-indigo-500/30">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Bem-vindo de volta</h1>
      <p class="text-sm text-slate-400 mt-1">Entre com as suas credenciais para acessar a conta</p>
    </div>

    <!-- Formulário -->
    <form class="space-y-5" onsubmit="event.preventDefault()">
      <div>
        <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">E-mail</label>
        <input 
          type="email" 
          placeholder="seu@email.com" 
          class="w-full px-4 py-3 rounded-xl bg-slate-950/50 border border-slate-800 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
          required
        />
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider">Senha</label>
          <a href="#" class="text-xs text-indigo-400 hover:text-indigo-300 transition">Esqueceu a senha?</a>
        </div>
        <input 
          type="password" 
          placeholder="••••••••" 
          class="w-full px-4 py-3 rounded-xl bg-slate-950/50 border border-slate-800 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
          required
        />
      </div>

      <div class="flex items-center">
        <input 
          type="checkbox" 
          id="remember" 
          class="w-4 h-4 rounded bg-slate-950 border-slate-800 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900"
        />
        <label for="remember" class="ml-2 text-xs text-slate-400 select-none">Lembrar-se por 30 dias</label>
      </div>

      <button 
        type="submit" 
        class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition cursor-pointer"
      >
        Entrar na conta
      </button>
    </form>

    <!-- Divisor -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
      <div class="relative flex justify-center text-xs uppercase"><span class="bg-slate-900 px-3 text-slate-500">Ou continue com</span></div>
    </div>

    <!-- Botão Social (Google) -->
    <div id="google-signin-button"></div>

    <!-- Rodapé -->
    <p class="text-center text-xs text-slate-500 mt-6">
      Não tem uma conta? 
      <a href="#" class="text-indigo-400 hover:text-indigo-300 font-medium transition">Cadastre-se gratuitamente</a>
    </p>
  </div>
</div>
