<!-- Fundo Escuro do Modal (Restaurado) -->
<!-- O (click)="closePlayer()" faz com que clicar no fundo escuro feche o modal -->
<div 
  class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md"
  (click)="closePlayer()"
>
  
  <!-- Corpo do Modal -->
  <!-- O (click)="$event.stopPropagation()" impede que o clique no vídeo feche o modal -->
  <div 
    class="relative w-full max-w-4xl bg-slate-900 overflow-hidden shadow-2xl rounded-xl"
    (click)="$event.stopPropagation()"
  >
    
    <!-- Botão Fechar -->
    <button 
      type="button" 
      (click)="closePlayer()"
      class="absolute top-3 right-3 z-50 p-2 flex items-center justify-center text-slate-400 hover:text-white bg-slate-800/80 hover:bg-slate-700/80 rounded-full transition-colors cursor-pointer"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Estado de Carregamento -->
    @if (isLoading()) {
      <div class="relative aspect-video w-full flex flex-col items-center justify-center bg-slate-950/50 gap-4">
        <div class="w-10 h-10 border-4 border-rose-500/30 border-t-rose-500 rounded-full animate-spin"></div>
        <p class="text-slate-400 font-medium text-sm animate-pulse">Buscando o melhor trailer...</p>
      </div>
    }

    <!-- Player de Vídeo -->
    @if (trailerUrl() && !isLoading()) {
      <div class="relative aspect-video w-full bg-black">
        <iframe 
          [src]="trailerUrl()" 
          title="Trailer do Filme"
          class="w-full h-full"
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen
        ></iframe>
      </div>
    }
  </div>
  
</div>
