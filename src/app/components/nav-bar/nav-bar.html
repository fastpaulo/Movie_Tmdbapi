<header class="w-full bg-slate-900 border-b border-slate-800 px-4 sm:px-8 py-3 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">

    <!-- Dados do Usuário Google -->
    
      <div class="flex items-center gap-3 min-w-0">
        <!-- Foto de Perfil com borda -->
        <img 
          [src]="imageProfile" 
          [alt]="name" 
          class="w-10 h-10 rounded-full object-cover border-2 border-slate-700 shadow-sm shrink-0"
          referrerpolicy="no-referrer"
        />

        <!-- Nome e E-mail -->
        <div class="flex flex-col min-w-0">
          <span class="text-sm font-semibold text-white truncate">
            {{ name }}
          </span>
          <span class="text-xs text-slate-400 truncate">
            {{ email }}
          </span>
        </div>
      </div>
    

    <!-- Botão de Sair (Redireciona para /login) -->
    <button 
      type="button"
      (click)="signOut()"
      class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-sm font-medium text-rose-400 hover:text-white bg-rose-500/10 hover:bg-rose-600 border border-rose-500/20 hover:border-transparent transition-all duration-200 shrink-0 cursor-pointer"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span>Sair</span>
    </button>

  </div>
</header>
