<app-nav-bar />

<div class="min-h-screen bg-slate-950 text-slate-100 p-6 md:p-10 space-y-12">
<section>
      <!-- Cabeçalho Favoritos -->
      <header
        class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-slate-800 pb-4">
        <div>
          <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white flex items-center gap-2">
            <span class="text-rose-500">❤️</span> Meus Favoritos
          </h2>
          <p class="text-slate-400 mt-1 text-xs md:text-sm">Seus filmes salvos</p>
        </div>

        <div class="flex items-center gap-2">
          <span
            class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20">
            Favoritos: {{ myMovies().length }}
          </span>
        </div>
      </header>

      <!-- Grid Favoritos -->
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6">
        @for (fav of myMovies(); track fav.id) {
          <article
            class="group relative flex flex-col bg-slate-900 rounded-xl overflow-hidden border border-slate-800/80 shadow-md hover:shadow-2xl hover:shadow-rose-950/20 hover:border-slate-700 transition-all duration-300 transform hover:-translate-y-1.5 cursor-pointer">

            <!-- Pôster -->
            <div (click)="MovieDetails(fav.id)" class="relative aspect-[2/3] w-full overflow-hidden bg-slate-800">
              <img [src]="imageBaseUrl + fav.poster_path" [alt]="fav.title"
                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                loading="lazy" />

              <!-- Badge de Nota -->
              <div
                class="absolute top-2 right-2 flex items-center gap-1 bg-slate-950/80 backdrop-blur-md px-2 py-0.5 rounded-md border border-slate-700/50">
                <span class="text-amber-400 text-xs">★</span>
                <span class="text-xs font-bold text-amber-300">
                  {{ fav.vote_average | number:'1.1-1' }}
                </span>
              </div>

              <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-60">
              </div>
            </div>

            <!-- Informações -->
            <div class="p-3.5 flex flex-col flex-grow justify-between gap-2">
              <h3
                class="font-semibold text-slate-100 text-sm md:text-base leading-snug line-clamp-1 group-hover:text-rose-400 transition-colors"
                [title]="fav.title">
                {{ fav.title }}
              </h3>

              <!-- Botão de Remover -->
              <button (click)="removeFavorite(fav.id); $event.stopPropagation()"
                class="mt-1 w-full text-center text-xs py-1.5 px-2 rounded bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 transition-colors">
                Remover
              </button>
            </div>

          </article>
        } @empty {
          <div
            class="col-span-full py-12 text-center text-slate-500 bg-slate-900/40 rounded-xl border border-dashed border-slate-800">
            <p class="text-sm md:text-base">Você ainda não favoritou nenhum filme.</p>
          </div>
        }
      </div>
    </section>

  <div class="max-w-7xl mx-auto space-y-12">
